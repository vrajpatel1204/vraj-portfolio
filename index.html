
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="description" content="Vraj Patel's personal website. Portfolio coming soon.">
  <title>Vraj Patel</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0c0c0e;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main { width: 100%; max-width: 760px; }

    .status {
      color: #a3a3a3;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 9px;
      border-radius: 50%;
      background: #8db8a1;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 10vw, 6.5rem);
      font-weight: 600;
      letter-spacing: -0.07em;
    }

    .message {
      margin-top: 24px;
      color: #a3a3a3;
      font-size: 18px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding-bottom: 6px;
      color: #f5f5f5;
      text-decoration: none;
      border-bottom: 1px solid #666;
    }

    a:hover { color: #b8c9ff; }

    footer {
      margin-top: 80px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <p class="status"><span class="dot"></span>Website in progress</p>
    <h1>Vraj Patel.</h1>
    <p class="message">
      Building something meaningful.<br>
      My portfolio is coming soon.
    </p>
    <a href="https://www.linkedin.com/in/vraj-patel1204/"
       target="_blank" rel="noopener noreferrer">
      Connect on LinkedIn ↗
    </a>
    <footer>© 2026 Vraj Patel</footer>
  </main>
</body>
</html>
